<div class="container">

  <h1>Signup</h1>

  <form
    [formGroup]="signupForm"
    (ngSubmit)="onSubmit()"
  >

    <input
      type="email"
      placeholder="Email"
      formControlName="email"
    />

    <input
      type="password"
      placeholder="Password"
      formControlName="password"
    />

    <button type="submit">

      {{ loading ? 'Loading...' : 'Signup' }}

    </button>

  </form>

  <p *ngIf="errorMessage">

    {{ errorMessage }}

  </p>

</div>
