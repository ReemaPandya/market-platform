version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: market-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: market_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: market-redis
    restart: always
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: market-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: market-kafka-ui
    restart: always
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
    depends_on:
      - redpanda

  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: market-auth-service
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - ../../services/auth-service/.env
    depends_on:
      - postgres
      - redis
      - redpanda

  gateway:
    image: nginx:latest
    container_name: market-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ../../gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service

volumes:
  postgres_data: