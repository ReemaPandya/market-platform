apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: market-platform
data:
  nginx.conf: |
    events {}

    http {
        server {
            listen 80;

            location /auth/ {
                proxy_pass http://auth-service:8081/;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /trading/ {
                proxy_pass http://trading-service:8082/api/;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /market/ {
                proxy_pass http://market-service:8083/api/market/;

                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /health {
                return 200 '{"service":"gateway","status":"healthy"}';
                add_header Content-Type application/json;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: market-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway
          image: nginx:latest

          ports:
            - containerPort: 80

          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: market-platform
spec:
  selector:
    app: gateway

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

  type: NodePort
