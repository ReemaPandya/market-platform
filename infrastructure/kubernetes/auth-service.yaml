apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: market-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: docker-auth-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          envFrom:
            - secretRef:
                name: auth-service-secrets

          env:
            - name: PORT
              value: "8081"

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: market-platform
spec:
  selector:
    app: auth-service

  ports:
    - port: 8081
      targetPort: 8081

  type: ClusterIP
