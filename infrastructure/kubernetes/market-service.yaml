apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
  namespace: market-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: market-service

  template:
    metadata:
      labels:
        app: market-service

    spec:
      containers:
        - name: market-service
          image: docker-market-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083

          envFrom:
            - secretRef:
                name: market-service-secrets

          env:
            - name: PORT
              value: "8083"

            - name: REDIS_ADDR
              value: "redis:6379"

          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: market-service
  namespace: market-platform
spec:
  selector:
    app: market-service

  ports:
    - port: 8083
      targetPort: 8083

  type: ClusterIP
