events {}

http {

    server {

        listen 80;

        location /auth/ {

            proxy_pass http://auth-service:8081/;
        }
        location /market/ {

            proxy_pass http://market-service:8082/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
        }
    }
}